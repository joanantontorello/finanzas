# Categorías en dos niveles: grupo y subcategorías. Los movimientos guardan la SUBCATEGORÍA; el grupo sale de aquí.
#   esencial: true / false para medir fugas (porcentaje no esencial); null = fuera de ese cálculo.
#   ambito:   ámbito por defecto de todo el grupo (Trabajo); ambito_sub lo fija para una subcategoría concreta.
#   roles:    marcas técnicas que usa el código. No las cambies de nombre sin avisar.
# La etiqueta Personal / Trabajo y la de ½ Kate van aparte, en cada movimiento.

Gasto:
  Vivienda y suministros:
    esencial: true
    sub: [Alquiler, Supermercado, Electricidad, Agua, Internet y teléfono, Seguros, Hogar y equipamiento]
  Salud y deporte:
    esencial: true
    sub: [Psicología, Jiu-jitsu, Pádel, Gimnasio, Farmacia y salud, Peluquería y autocuidado]
  Transporte:
    esencial: true
    sub: [Transporte público, BiciMAD, Uber y taxi, Trenes y AVE, Vuelos, "Gasolina, peajes y parking"]
  Empresa:
    esencial: true
    ambito: Trabajo
    sub: [Cuota de autónomos, IRPF e IVA trimestral, Gestoría, Herramientas de trabajo]
  Préstamos y deudas:
    esencial: true
    sub: [Deuda Hacienda, Financiaciones, Otras deudas]
    ambito_sub: {Deuda Hacienda: Trabajo}
  Hábitos diarios:
    esencial: false
    sub: [Café, Açaí y brunch, Comida a domicilio]
  Ocio y vida social:
    esencial: false
    sub: [Restaurantes, Citas y pareja, Planes y ocio, Ropa, Compras impulsivas]
  Viajes:
    esencial: false
    sub: [Alojamiento, Comida y gastos en destino, Actividades]
  Suscripciones:
    esencial: false
    sub: [Streaming de vídeo, Música, Almacenamiento, Apps personales]
  Formación:
    esencial: false
    sub: [Mentoría y cursos, Libros, Mastermind]
  Otros:
    esencial: null
    sub: [Ajustes con Kate, Efectivo, Imprevistos]
    roles: {Ajustes con Kate: ajustes_pareja, Imprevistos: imprevistos}

Reembolso:
  Reembolsos:
    esencial: null
    sub: [Reembolsos]
    roles: {Reembolsos: reembolsos}

Ingreso:
  Ingresos:
    sub: [Trabajo, Trabajos extra, Clases y formación, Alquileres, Dividendos e intereses, Otros ingresos]
    ambito_sub: {Trabajo: Trabajo}

Inversion:
  Inversiones:
    sub: [Fondos indexados y ETF, Acciones, Criptomonedas, Vivienda e inmuebles]

Traspaso:
  Traspasos:
    sub: [Traspaso entre cuentas, Aportación de Kate]
    roles: {Traspaso entre cuentas: traspaso, Aportación de Kate: aportacion_pareja}
