# Reglas de clasificación. Se evalúan EN ORDEN y gana la primera que encaja.
# Campos: id, cuenta (una o lista), match (regex sobre el concepto, sin distinguir mayúsculas),
#         desde/hasta (rango de fechas), min/max (importe absoluto), signo (+ o -),
#         tipo, categoria, ambito (Personal por defecto), estado (auto por defecto; "pendiente" = sugerencia a revisar), nota.
# Cuando corrijas algo a mano, añade la regla aquí para que el mes que viene salga solo.

# ---------------------------------------------------------------- 1. Traspasos entre cuentas propias y aportaciones a la conjunta
- {id: rev_topup_tr,       cuenta: [Revolut, Conjunta], match: "Apple Pay top-up by \\*5233",                       tipo: Traspaso, categoria: TRASPASO, nota: recarga desde tarjeta Trade Republic}
- {id: rev_to_tr,          cuenta: Revolut,  match: "\\[Transfer\\] To Joan Anton Torello Lopez",                     tipo: Traspaso, categoria: TRASPASO}
- {id: rev_to_conjunta,    cuenta: Revolut,  match: "Transfer to JOAN ANTON TORELLO LOPEZ & KATERYNA",               tipo: Traspaso, categoria: TRASPASO, nota: aportación a la conjunta}
- {id: conj_from_joan,     cuenta: Conjunta, match: "Transfer from JOAN ANTON TORELLO LOPEZ",                        tipo: Traspaso, categoria: TRASPASO}
- {id: conj_from_kate,     cuenta: Conjunta, match: "(Payment|Transfer) from KATERYNA",                              tipo: Traspaso, categoria: APORTACIÓN KATE}
- {id: tr_revolut_card,    cuenta: Trade Republic, match: "Revolut\\*\\*3407",                                       tipo: Traspaso, categoria: TRASPASO, nota: recarga de Revolut}
- {id: tr_from_joan,       cuenta: Trade Republic, match: "Incoming transfer from Joan Anton",                       tipo: Traspaso, categoria: TRASPASO}
- {id: tr_to_joan,         cuenta: Trade Republic, match: "Outgoing transfer for Joan Anton",                        tipo: Traspaso, categoria: TRASPASO, nota: a BBVA}
- {id: bbva_from_joan,     cuenta: BBVA,     match: "Transferencia recibida \\| Joan anton",                         tipo: Traspaso, categoria: TRASPASO}
- {id: bbva_t_trimestre,   cuenta: BBVA,     match: "Transferencia recibida \\| T\\d ",                               tipo: Traspaso, categoria: TRASPASO, nota: dinero que te pasas desde Trade Republic para pagar el IRPF trimestral}
- {id: bbva_regalo,        cuenta: BBVA,     match: "Transferencia recibida \\| Regalo",                                tipo: Ingreso, categoria: OTROS/EXTRAS}
- {id: bbva_transfer_in,   cuenta: BBVA,     match: "Transferencia recibida", signo: "+",                                 tipo: Reembolso, categoria: REEMBOLSOS}
- {id: godaddy,            match: "GODADDY|Godaddy",                                                                  tipo: Gasto, categoria: SUBSCRIPCIONES, ambito: Trabajo}

# ---------------------------------------------------------------- 2. Ingresos
- {id: sueldo_fidelio,     match: "Incoming transfer from FIDELIO",                                                  tipo: Ingreso, categoria: SUELDO, ambito: Trabajo}
- {id: tr_interes,         cuenta: Trade Republic, match: "^\\[Interés\\]|^\\[Bonificación\\]|^\\[Rentabilidad\\]",  tipo: Ingreso, categoria: INTERESES}
- {id: bbva_bonif_viajes,  cuenta: BBVA,     match: "bonificación pack viajes",                                      tipo: Reembolso, categoria: VIAJES, nota: devolución comisión cajero extranjero}

# ---------------------------------------------------------------- 3. Reembolsos (Bizums de amigos, devoluciones)
- {id: rev_bizum_in,       cuenta: Revolut,  match: "Money added via BIZUM",                                         tipo: Reembolso, categoria: REEMBOLSOS}
- {id: rev_from_kate,      cuenta: Revolut,  match: "(Payment|Transfer) from KATERYNA",                              tipo: Reembolso, categoria: REEMBOLSOS, nota: Kate te devuelve algo}
- {id: rev_transfer_in,    cuenta: Revolut,  match: "^\\[Transfer\\] Transfer from ",                                tipo: Reembolso, categoria: REEMBOLSOS}
- {id: tr_from_kate,       cuenta: Trade Republic, match: "Incoming transfer from Kateryna",                         tipo: Reembolso, categoria: REEMBOLSOS}
- {id: tr_incoming_otros,  cuenta: Trade Republic, match: "Incoming transfer from ", signo: "+",                     tipo: Reembolso, categoria: REEMBOLSOS}
- {id: rev_card_refund,    cuenta: [Revolut, Conjunta], match: "^\\[Card Refund\\]",                                 tipo: Reembolso, categoria: REEMBOLSOS, nota: devolución de compra}
- {id: rev_chargeback,     cuenta: [Revolut, Conjunta], match: "^\\[Card Chargeback\\]",                             tipo: Gasto, categoria: SUBSCRIPCIONES, ambito: Trabajo, nota: devolución Higgsfield}

# ---------------------------------------------------------------- 4. Inversiones (Trade Republic)
- {id: tr_crypto,          cuenta: Trade Republic, match: "\\[Operar\\] (Buy|Sell) trade XF000",                    tipo: Inversion, categoria: CRYPTOMONEDAS}
- {id: tr_etf,             cuenta: Trade Republic, match: "\\[Operar\\] .*(UCITS|ETF|Savings plan)",                 tipo: Inversion, categoria: FONDOS INDEXADOS / ETF}
