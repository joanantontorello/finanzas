# Reglas de clasificación. Se evalúan EN ORDEN y gana la primera que encaja.
# Campos: id, cuenta (una o lista), match (regex sobre el concepto, sin distinguir mayúsculas),
#         desde/hasta (rango de fechas), min/max (importe absoluto), signo (+ o -), participacion,
#         tipo, categoria (= SUBCATEGORÍA de config/categorias.yaml), ambito (si no, el de la categoría),
#         estado (auto por defecto; "pendiente" = sugerencia a revisar), nota.
# Las correcciones del dashboard se convierten solas en reglas "auto_*" (sección aprendidas).

# ---------------------------------------------------------------- 1. Traspasos entre cuentas propias y aportaciones a la conjunta
- {id: rev_topup_tr,       cuenta: [Revolut, Conjunta], match: "Apple Pay top-up by \\*5233",                       tipo: Traspaso, categoria: "Traspaso entre cuentas", nota: recarga desde tarjeta Trade Republic}
- {id: rev_to_tr,          cuenta: Revolut,  match: "\\[Transfer\\] To Joan Anton Torello Lopez",                     tipo: Traspaso, categoria: "Traspaso entre cuentas"}
- {id: rev_to_conjunta,    cuenta: Revolut,  match: "Transfer to JOAN ANTON TORELLO LOPEZ & KATERYNA",               tipo: Traspaso, categoria: "Traspaso entre cuentas", nota: aportación a la conjunta}
- {id: conj_from_joan,     cuenta: Conjunta, match: "Transfer from JOAN ANTON TORELLO LOPEZ",                        tipo: Traspaso, categoria: "Traspaso entre cuentas"}
- {id: conj_from_kate,     cuenta: Conjunta, match: "(Payment|Transfer) from KATERYNA",                              tipo: Traspaso, categoria: "Aportación de Kate"}
- {id: tr_revolut_card,    cuenta: Trade Republic, match: "Revolut\\*\\*3407",                                       tipo: Traspaso, categoria: "Traspaso entre cuentas", nota: recarga de Revolut}
- {id: tr_from_joan,       cuenta: Trade Republic, match: "Incoming transfer from Joan Anton",                       tipo: Traspaso, categoria: "Traspaso entre cuentas"}
- {id: tr_to_joan,         cuenta: Trade Republic, match: "Outgoing transfer for Joan Anton",                        tipo: Traspaso, categoria: "Traspaso entre cuentas", nota: a BBVA}
- {id: bbva_from_joan,     cuenta: BBVA,     match: "Transferencia recibida \\| Joan anton",                         tipo: Traspaso, categoria: "Traspaso entre cuentas"}
- {id: bbva_t_trimestre,   cuenta: BBVA,     match: "Transferencia recibida \\| T\\d ",                               tipo: Traspaso, categoria: "Traspaso entre cuentas", nota: dinero que te pasas desde Trade Republic para pagar el IRPF trimestral}
- {id: bbva_regalo,        cuenta: BBVA,     match: "Transferencia recibida \\| Regalo",                                tipo: Ingreso, categoria: "Otros ingresos"}
- {id: bbva_transfer_propia, cuenta: BBVA,   match: "Transferencia recibida", signo: "+", min: 200,                      tipo: Traspaso, categoria: "Traspaso entre cuentas", nota: "transferencia grande a BBVA: tuya, para impuestos"}
- {id: bbva_transfer_in,   cuenta: BBVA,     match: "Transferencia recibida", signo: "+",                                 tipo: Reembolso, categoria: "Reembolsos"}

